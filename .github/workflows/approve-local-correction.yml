name: 核准地方資料欄位修正

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/套用修正' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 保存並套用人工修正
        run: node scripts/approve-local-correction.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
      - name: 提交修正資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/local-corrections.json public/data/local-official.json
          git commit -m "套用地方資料欄位修正 #${{ github.event.issue.number }}"
          git push
      - name: 回覆並關閉議題
        run: gh issue close "${{ github.event.issue.number }}" --comment "已核准並套用欄位修正；原始官方來源仍保留，網站將自動重新發布。"
        env:
          GH_TOKEN: ${{ github.token }}
